<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="MKT&Play | Consultores-curadores de soluções de Marketing Digital. Com o método Plug and Play, simplificamos a gestão do seu marketing e conectamos as melhores ferramentas para o seu negócio crescer." />
    <meta name="theme-color" content="#C6F058" />
    <link rel="canonical" href="https://mktplay.com.br/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mktplay.com.br/" />
    <meta property="og:title" content="MKT&Play | Consultores-Curadores de Marketing Digital" />
    <meta property="og:description" content="Com o método Plug and Play, simplificamos a gestão do seu marketing e conectamos as melhores ferramentas para o seu negócio crescer." />
    <meta property="og:image" content="" />

    <title>MKT&amp;Play | Consultores-Curadores de Marketing Digital</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            lime:   '#C6F058',
                            dark:   '#2A303C',
                            darker: '#1E232B',
                            gray:   '#F3F4F6',
                        }
                    },
                    keyframes: {
                        'fade-up': {
                            '0%':   { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        'pulse-lime': {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(198,240,88,0.4)' },
                            '50%':      { boxShadow: '0 0 0 12px rgba(198,240,88,0)' },
                        }
                    },
                    animation: {
                        'fade-up':    'fade-up 0.7s ease-out forwards',
                        'pulse-lime': 'pulse-lime 2.5s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <!-- Critical CSS -->
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #1E232B; }
        #inicio { min-height: 100svh; }
        img { font-size: 0; display: block; height: auto; max-width: 100%; }
        ::selection { background: #C6F058; color: #1E232B; }
    </style>
